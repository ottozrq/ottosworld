<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>video</title>
</head>
<body>

<style>
    video {
        margin: 10px;
    }
</style>

<div class="box">
    <video
            controls poster="{{ url_for('static', filename='img/video/product.png') }}">
        <source src="{{ url_for('static', filename = 'video/jintai.mp4') }}" type="video/mp4">
        <p>Your browser doesn't support HTML5 video. Here is
            a <a href="{{ url_for('static', filename = 'video/wedding1.mp4') }}">link to the video</a> instead.</p>
    </video>
    <video
            controls poster="{{ url_for('static', filename='img/video/wedding1.png') }}">
        <source src="{{ url_for('static', filename = 'video/wedding1.mp4') }}" type="video/mp4">
        <p>Your browser doesn't support HTML5 video. Here is
            a <a href="{{ url_for('static', filename = 'video/wedding1.mp4') }}">link to the video</a> instead.</p>
    </video>
    <video
            controls poster="{{ url_for('static', filename='img/video/wedding2.png') }}">
        <source src="{{ url_for('static', filename = 'video/wedding2.mp4') }}" type="video/mp4">
        <p>Your browser doesn't support HTML5 video. Here is
            a <a href="{{ url_for('static', filename = 'video/wedding2.mp4') }}">link to the video</a> instead.</p>
    </video>
    <video
            controls poster="{{ url_for('static', filename='img/video/fashion1.png') }}">
        <source src="{{ url_for('static', filename = 'video/fashion1.mp4') }}" type="video/mp4">
        <p>Your browser doesn't support HTML5 video. Here is
            a <a href="{{ url_for('static', filename = 'video/fashion1.mp4') }}">link to the video</a> instead.</p>
    </video>
</div>

<script>
    $(document).ready(function () {
        if ($(window).width() > 550)
            $('video').attr('width', $(window).width() / 2);
        else
            $('video').attr('width', $(window).width() - 50);
    })
</script>

</body>
</html>
